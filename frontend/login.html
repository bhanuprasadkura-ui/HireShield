<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | HireShield</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Hire<span>Shield</span>
            </div>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

            </div>

        </nav>

    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <main class="auth-page">

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <p class="section-tag">
                    WELCOME BACK
                </p>

                <h1>
                    Login to HireShield
                </h1>

                <p>
                    Access your candidate or recruiter account.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


                <!-- MESSAGE -->

                <p
                    id="loginMessage"
                    class="form-message"
                ></p>


            </form>


            <!-- REGISTER LINK -->

            <div class="auth-footer">

                <p>

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/api.js"></script>

    <script src="js/login.js"></script>


</body>

</html>
