<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Skills | HireShield</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body data-role="CANDIDATE">

    <!-- ================================
         NAVBAR
    ================================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Hire<span>Shield</span>
            </div>


            <div class="nav-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <a href="skills.html">
                    Skills
                </a>

                <a href="jobs.html">
                    Jobs
                </a>

                <a href="applications.html">
                    Applications
                </a>

                <a href="#" id="logoutBtn">
                    Logout
                </a>

            </div>

        </nav>

    </header>



    <!-- ================================
         SKILLS PAGE
    ================================= -->

    <main class="skills-page">

        <section class="skills-header">

            <p class="section-tag">
                TECHNICAL SKILLS
            </p>

            <h1>
                My Skills
            </h1>

            <p>
                Add your technical skills and specify
                your proficiency level to improve job matching.
            </p>

        </section>



        <!-- ================================
             ADD SKILL
        ================================= -->

        <section class="skills-card">

            <div class="skills-card-header">

                <h2>
                    Add a Skill
                </h2>

            </div>


            <form id="skillForm">

                <div class="skill-form-grid">


                    <div class="form-group">

                        <label for="skillName">
                            Skill
                        </label>

                        <select
                            id="skillName"
                            required
                        >

                            <option value="">
                                Select a skill
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="proficiency">
                            Proficiency
                        </label>

                        <select
                            id="proficiency"
                            required
                        >

                            <option value="">
                                Select proficiency
                            </option>

                            <option value="Beginner">
                                Beginner
                            </option>

                            <option value="Intermediate">
                                Intermediate
                            </option>

                            <option value="Advanced">
                                Advanced
                            </option>

                            <option value="Expert">
                                Expert
                            </option>

                        </select>

                    </div>


                </div>


                <button
                    type="submit"
                    class="auth-btn skill-add-btn"
                >
                    Add Skill
                </button>


                <p
                    id="skillMessage"
                    class="form-message"
                ></p>

            </form>

        </section>



        <!-- ================================
             MY SKILLS
        ================================= -->

        <section class="skills-card">

            <div class="skills-card-header">

                <h2>
                    My Skills
                </h2>

                <span id="skillsCount">
                    0 Skills
                </span>

            </div>


            <div
                id="skillsList"
                class="skills-list"
            >

                <p class="empty-skills">
                    Loading skills...
                </p>

            </div>

        </section>

    </main>



    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="../js/api.js"></script>

    <script src="../js/role-guard.js"></script>

    <script src="../js/skills.js"></script>

</body>

</html>
