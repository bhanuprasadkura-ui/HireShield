
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills | HireShield</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-role="CANDIDATE">
    <header>
        <nav class="navbar">
            <div class="logo">Hire<span>Shield</span></div>

            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="profile.html">Profile</a>
                <a href="skills.html">Skills</a>
                <a href="jobs.html">Jobs</a>
                <a href="applications.html">Applications</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </nav>
    </header>

    <main class="skills-page">
        <section class="skills-header">
            <p class="section-tag">TECHNICAL SKILLS</p>
            <h1>My Skills</h1>
            <p>
                Add your technical skills and specify your
                proficiency level to improve job matching.
            </p>
        </section>

        <section class="skills-card">
            <div class="skills-card-header">
                <h2>Add a Skill</h2>
            </div>

            <form id="skillForm">
                <div class="form-group">
                    <label for="skillType">Skill Type</label>
                    <select id="skillType" required>
                        <option value="existing">Choose an existing skill</option>
                        <option value="custom">Enter my own skill</option>
                    </select>
                </div>

                <div class="skill-form-grid">
                    <div class="form-group" id="existingSkillGroup">
                        <label for="skillName">Skill</label>
                        <select id="skillName">
                            <option value="">Loading skills...</option>
                        </select>
                    </div>

                    <div class="form-group" id="customSkillGroup" hidden>
                        <label for="customSkillName">Custom Skill</label>
                        <input
                            type="text"
                            id="customSkillName"
                            placeholder="e.g. Docker, Kubernetes, Figma"
                            maxlength="100"
                            autocomplete="off"
                        >
                    </div>

                    <div class="form-group">
                        <label for="proficiency">Proficiency</label>
                        <select id="proficiency" required>
                            <option value="">Select proficiency</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate" selected>Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Expert">Expert</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="auth-btn skill-add-btn">
                    Add Skill
                </button>

                <p id="skillMessage" class="form-message" role="status"></p>
            </form>
        </section>

        <section class="skills-card">
            <div class="skills-card-header">
                <h2>My Skills</h2>
                <span id="skillsCount">0 Skills</span>
            </div>

            <div id="skillsList" class="skills-list">
                <p class="empty-skills">Loading skills...</p>
            </div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/role-guard.js"></script>
    <script src="../js/skills.js"></script>
</body>
</html>
