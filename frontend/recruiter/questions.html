<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assessment Questions | HireShield</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body data-role="RECRUITER">

<header>

    <nav class="navbar">

        <div class="logo">
            Hire<span>Shield</span>
        </div>

        <div class="nav-links">

            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="applicants.html">Applicants</a>
            <a href="assessments.html">Assessments</a>
            <a href="results.html">Results</a>
            <a href="#" id="logoutBtn">Logout</a>

        </div>

    </nav>

</header>


<main class="education-page">

    <section class="education-header">

        <p class="section-tag">
            ASSESSMENT QUESTIONS
        </p>

        <h1 id="assessmentTitle">
            Questions
        </h1>

        <p id="assessmentDescription">
            Add multiple-choice questions to this assessment.
        </p>

    </section>


    <!-- ADD QUESTION -->

    <section class="education-card">

        <div class="education-card-header">
            <h2>Add Question</h2>
        </div>

        <form id="questionForm">

            <div class="education-form-grid">

                <div
                    class="form-group"
                    style="grid-column: 1 / -1;"
                >

                    <label for="questionText">
                        Question
                    </label>

                    <textarea
                        id="questionText"
                        rows="3"
                        placeholder="Enter the question..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="optionA">
                        Option A
                    </label>

                    <input
                        type="text"
                        id="optionA"
                        placeholder="Option A"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="optionB">
                        Option B
                    </label>

                    <input
                        type="text"
                        id="optionB"
                        placeholder="Option B"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="optionC">
                        Option C
                    </label>

                    <input
                        type="text"
                        id="optionC"
                        placeholder="Option C"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="optionD">
                        Option D
                    </label>

                    <input
                        type="text"
                        id="optionD"
                        placeholder="Option D"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="correctAnswer">
                        Correct Answer
                    </label>

                    <select id="correctAnswer" required>

                        <option value="">
                            Select correct option
                        </option>

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                class="auth-btn education-add-btn"
            >
                Add Question
            </button>


            <p
                id="questionMessage"
                class="form-message"
            ></p>

        </form>

    </section>


    <!-- QUESTIONS -->

    <section class="education-card">

        <div class="education-card-header">

            <h2>
                Questions
            </h2>

            <span id="questionCount">
                0 Questions
            </span>

        </div>


        <div
            id="questionList"
            class="education-list"
        >

            <p class="empty-education">
                Loading questions...
            </p>

        </div>

    </section>

</main>


<script src="../js/api.js"></script>
<script src="../js/role-guard.js"></script>
<script src="../js/questions.js"></script>

</body>

</html>
