<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applicants | HireShield</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body data-role="RECRUITER">

<header>

    <nav class="navbar">

        <div class="logo">
            Hire<span>Shield</span>
        </div>

        <div class="nav-links">

            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="applicants.html">Applicants</a>
            <a href="assessments.html">Assessments</a>
            <a href="results.html">Results</a>
            <a href="#" id="logoutBtn">Logout</a>

        </div>

    </nav>

</header>


<main class="education-page">

    <section class="education-header">

        <p class="section-tag">
            CANDIDATE MANAGEMENT
        </p>

        <h1>
            Applicants
        </h1>

        <p>
            Review candidates, check their match scores,
            assign assessments and update application status.
        </p>

    </section>


    <!-- JOB SELECTOR -->

    <section class="education-card">

        <div class="education-card-header">
            <h2>Select Job</h2>
        </div>

        <div class="form-group">

            <label for="jobSelect">
                Job Opening
            </label>

            <select id="jobSelect">

                <option value="">
                    Select a job
                </option>

            </select>

        </div>

    </section>


    <!-- APPLICANTS -->

    <section class="education-card">

        <div class="education-card-header">

            <h2>
                Applicants
            </h2>

            <span id="applicantCount">
                0 Applicants
            </span>

        </div>


        <div
            id="applicantList"
            class="education-list"
        >

            <p class="empty-education">
                Select a job to view applicants.
            </p>

        </div>

    </section>

</main>


<script src="../js/api.js"></script>
<script src="../js/role-guard.js"></script>
<script src="../js/applicants.js"></script>

</body>

</html>
