<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | HireShield</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                Hire<span>Shield</span>
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

            </div>

        </nav>
    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <p class="section-tag">
                    GET STARTED
                </p>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Join HireShield as a candidate or recruiter.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select
                        id="role"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="CANDIDATE">
                            Candidate
                        </option>

                        <option value="RECRUITER">
                            Recruiter
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </div>

    </main>


    <script src="js/api.js"></script>

    <script src="js/register.js"></script>

</body>

</html>
